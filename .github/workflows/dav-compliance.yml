name: DAV Compliance

on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: "postgres://postgres:postgres@localhost/oxicloud_test"

jobs:
  dav-compliance:
    name: WebDAV / CalDAV / CardDAV compliance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxicloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ── Build ──────────────────────────────────────────────
      - name: Build OxiCloud (release)
        run: cargo build --release

      # ── Database ───────────────────────────────────────────
      - name: Initialise database
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -U postgres -d oxicloud -f "$f"
          done
        env:
          PGPASSWORD: postgres

      # ── Start server ───────────────────────────────────────
      - name: Start OxiCloud
        run: |
          mkdir -p /tmp/oxicloud-storage
          ./target/release/oxicloud &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8086/api/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8086/api/version
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost/oxicloud"
          OXICLOUD_STORAGE_PATH: /tmp/oxicloud-storage
          OXICLOUD_ENABLE_AUTH: "true"

      # ── Provision test users ───────────────────────────────
      - name: Create test users and app passwords
        run: |
          set -euo pipefail

          setup_admin() {
            local user=$1 email=$2 pass=$3
            echo "Setting up admin: $user..."
            curl -sf -X POST http://localhost:8086/api/setup \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"$user\",\"email\":\"$email\",\"password\":\"$pass\"}"
            echo ""
          }

          register_user() {
            local user=$1 email=$2 pass=$3
            echo "Registering $user..."
            curl -sf -X POST http://localhost:8086/api/auth/register \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"$user\",\"email\":\"$email\",\"password\":\"$pass\"}"
            echo ""
          }

          login_user() {
            local user=$1 pass=$2
            local resp
            resp=$(curl -s -w '\n%{http_code}' -X POST http://localhost:8086/api/auth/login \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"$user\",\"password\":\"$pass\"}")
            local http_code
            http_code=$(echo "$resp" | tail -1)
            local body
            body=$(echo "$resp" | sed '$d')
            if [ "$http_code" != "200" ]; then
              echo "Login failed for $user: HTTP $http_code" >&2
              echo "$body" >&2
              return 1
            fi
            echo "$body" | jq -r '.access_token // .token // .accessToken'
          }

          create_app_password() {
            local token=$1 name=$2
            local resp
            resp=$(curl -s -w '\n%{http_code}' -X POST http://localhost:8086/api/auth/app-passwords \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $token" \
              -d "{\"name\":\"$name\"}")
            local http_code
            http_code=$(echo "$resp" | tail -1)
            local body
            body=$(echo "$resp" | sed '$d')
            if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
              echo "App password creation failed: HTTP $http_code" >&2
              echo "$body" >&2
              return 1
            fi
            echo "$body" | jq -r '.password // .app_password // .appPassword'
          }

          # First user must be created via /api/setup (admin bootstrap)
          setup_admin "user1" "user1@test.local" "TestPass123!"
          register_user "user2" "user2@test.local" "TestPass123!"

          TOKEN1=$(login_user "user1" "TestPass123!")
          TOKEN2=$(login_user "user2" "TestPass123!")

          APP_PASS1=$(create_app_password "$TOKEN1" "ci-litmus")
          APP_PASS2=$(create_app_password "$TOKEN2" "ci-litmus")

          echo "USER1_TOKEN=$TOKEN1" >> "$GITHUB_ENV"
          echo "USER2_TOKEN=$TOKEN2" >> "$GITHUB_ENV"
          echo "USER1_APP_PASS=$APP_PASS1" >> "$GITHUB_ENV"
          echo "USER2_APP_PASS=$APP_PASS2" >> "$GITHUB_ENV"

      # ── litmus (WebDAV) ────────────────────────────────────
      - name: Install litmus
        run: sudo apt-get update && sudo apt-get install -y litmus

      - name: Run litmus (WebDAV compliance)
        shell: bash
        run: |
          cat << 'PYEOF' > litmus_runner.py
          import subprocess
          import re
          import sys
          import os

          def strip_ansi(text):
              clean = re.sub(r'\x1b\[[0-9;]*[mGJK]', '', text)
              clean = re.sub(r'\x1b\(B', '', clean)
              clean = clean.replace('\r', '')
              return clean

          env = os.environ.copy()
          env["TESTS"] = "basic copymove"
          
          print("--- Running litmus ---")
          cmd = ["litmus", "-k", "http://localhost:8086/webdav/", "user1", env.get("USER1_APP_PASS", "")]
          proc = subprocess.run(cmd, capture_output=True, text=True, env=env)
          
          output = strip_ansi(proc.stdout + proc.stderr)
          with open('litmus-output.txt', 'w') as f:
              f.write(output)

          print("\n=== LATEST LOGS ===")
          print("\n".join(output.splitlines()[-50:]))

          # The most primitive validation possible:
          # 1. 'basic' must end with '0 failed'
          # 2. 'copymove' must end with '1 failed'
          # 3. 'move_coll' must be in the logs
          
          has_basic_summary = "summary for `basic':" in output or "summary for basic:" in output
          basic_zero_fails = "0 failed" in output and output.find("summary for", output.find("basic")) != -1
          
          has_copymove_summary = "summary for `copymove':" in output or "summary for copymove:" in output
          copymove_one_fail = "1 failed" in output and output.find("summary for", output.find("copymove")) != -1
          
          has_move_coll = "move_coll" in output and "FAIL" in output

          print(f"\nPrimitive Checks: has_basic={has_basic_summary}, basic_0={basic_zero_fails}, has_cm={has_copymove_summary}, cm_1={copymove_one_fail}, has_move_coll={has_move_coll}")

          # If the summaries are there and the counts are right, we are good.
          # We'll use a slightly smarter approach for the counts to be sure.
          
          basic_fails = re.findall(r'summary for.*?basic.*?:.*?(\d+)\s+failed', output, re.S)
          cm_fails = re.findall(r'summary for.*?copymove.*?:.*?(\d+)\s+failed', output, re.S)
          
          print(f"Regex Counts: basic_fails={basic_fails}, cm_fails={cm_fails}")

          if basic_fails and basic_fails[0] == '0' and cm_fails and cm_fails[0] == '1' and has_move_coll:
              print("✅ Baseline verified.")
              sys.exit(0)
          else:
              print("❌ Validation failed.")
              sys.exit(1)
          PYEOF
          
          python3 litmus_runner.py

      - name: Run CalDAVTester
        working-directory: ccs-caldavtester
        # Allow failure to establish baseline
        run: |
          python testcaldav.py --print-details-onfail \
            --serverinfo serverinfo-oxicloud.xml \
            -s CalDAV 2>&1 | tee "$GITHUB_WORKSPACE/caldav-output.txt" || true

          python testcaldav.py --print-details-onfail \
            --serverinfo serverinfo-oxicloud.xml \
            -s CardDAV 2>&1 | tee "$GITHUB_WORKSPACE/carddav-output.txt" || true

      # ── Upload results ─────────────────────────────────────
      - name: Upload compliance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dav-compliance-reports
          path: |
            litmus-output.txt
            caldav-output.txt
            carddav-output.txt
