[package]
name = "oxicloud"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "migrate"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
